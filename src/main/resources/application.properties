spring.application.name=cinemasystem
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db/changelog-master.yaml

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS}

reservation.expiration.minutes=${RESERVATION_EXPIRATION_MINUTES:10}
reservation.expiration.scheduler-delay-ms=${RESERVATION_EXPIRATION_SCHEDULER_DELAY_MS:60000}